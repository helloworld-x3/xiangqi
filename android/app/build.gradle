plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.helloworldx3.xiangqi'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'dev.helloworldx3.xiangqi'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs = [layout.buildDirectory.dir('generated/web-assets').get().asFile]
    }
}

tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'styles.css', 'engine.js', 'persistence.js', 'app.js', 'icons/**'
    }
    into layout.buildDirectory.dir('generated/web-assets')
}
tasks.named('preBuild') { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
